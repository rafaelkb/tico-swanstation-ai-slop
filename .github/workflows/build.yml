# Builds tico-swanstation.nro and the module bundle on every push, in the image
# build_swanstation_nro.sh is written for: danfromtico/switch-dev, devkitA64
# with libnx and mesa-switch (NVK, OpenGL and EGL for Horizon) in portlibs.
# The NRO and the bundle are the run's artifacts.
name: build
on:
  push:
  workflow_dispatch:
    inputs:
      debug:
        description: Keep the log (sdmc:/tico/debug/swanstation.txt)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nro:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/danfromtico/switch-dev:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Tools
        run: |
          command -v zip > /dev/null || { apt-get update && apt-get install -y --no-install-recommends zip; }
          git config --global --add safe.directory '*'
          cat /opt/devkitpro/portlibs/switch/share/switch-dev.json
      - name: Build
        env:
          SWAN_DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: bash build_swanstation_nro.sh
      # What was built, on the run's page: the files, and the shader presets
      # and settings that went into the NRO's romfs.
      - name: Summary
        id: name
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          cd build_tico
          nro=$(stat -c %s tico-swanstation.nro)
          presets=$(cd romfs/shaders && ls *.slangp | tr '\n' ' ')
          {
            echo "### tico-swanstation $(git rev-parse --short HEAD)"
            echo '```'
            sha256sum tico-swanstation.nro tico-*-module.zip
            echo "romfs: $(find romfs -type f | wc -l) files, shaders: $presets"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=tico-swanstation.nro::$nro bytes, shader presets: $presets"
      - uses: actions/upload-artifact@v7
        with:
          name: tico-swanstation-nro-${{ steps.name.outputs.sha }}
          path: build_tico/tico-swanstation.nro
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: tico-swanstation-module-${{ steps.name.outputs.sha }}
          path: build_tico/tico-*-module.zip
          if-no-files-found: error
